name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-lint:
    name: Build and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Database and account tests
        run: npm test
      - name: Supabase notification runtime
        run: |
          npx --yes deno@2.1.4 check --config supabase/functions/notification-delivery/deno.json supabase/functions/notification-delivery/index.ts
          npx --yes deno@2.1.4 test --config supabase/functions/notification-delivery/deno.json supabase/functions/notification-delivery/runtime.test.ts
      - name: Build
        run: npm run build

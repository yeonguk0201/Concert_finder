name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-lint:
    name: Build and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Database and account tests
        run: npm test
      - name: Supabase notification runtime
        run: |
          npx --yes deno@2.1.4 check --config supabase/functions/notification-delivery/deno.json supabase/functions/notification-delivery/index.ts
          npx --yes deno@2.1.4 test --config supabase/functions/notification-delivery/deno.json supabase/functions/notification-delivery/runtime.test.ts
      - name: Build
        run: npm run build
      - name: Artist review server runtime
        run: npx --yes deno@2.1.4 check --frozen --config supabase/functions/artist-review-runner/deno.json supabase/functions/artist-review-runner/index.ts
      - name: Isolated PostgreSQL review concurrency tests
        run: |
          docker run -d --rm --name concert-review-pg-ci --network none --tmpfs /var/lib/postgresql/data:rw,size=512m -e POSTGRES_HOST_AUTH_METHOD=trust postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
          for attempt in $(seq 1 30); do
            if docker exec concert-review-pg-ci pg_isready -U postgres; then break; fi
            sleep 1
          done
          CONCERT_TEST_PG_CONTAINER=concert-review-pg-ci node --test tests/artist-review-runner.postgres.mjs
      - name: Remove isolated PostgreSQL
        if: always()
        run: docker rm -f concert-review-pg-ci || true

name: Collect official concert candidates
on:
  workflow_dispatch:
    inputs:
      source:
        description: Collection source
        type: choice
        options: [all, kopis, ualive, mintpaper, radwimps]
        default: all
      kopis_slot:
        description: Optional KOPIS detail slot for a reproducible verification
        type: string
        default: ''
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
concurrency:
  group: collect-official-catalog
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: catalog-ingestion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Collect and upload candidates
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KOPIS_SERVICE_KEY: ${{ secrets.KOPIS_SERVICE_KEY }}
          COLLECTION_SOURCE: ${{ inputs.source || 'all' }}
          KOPIS_SLOT: ${{ inputs.kopis_slot }}
        run: |
          args=("--source=$COLLECTION_SOURCE" "--upload" "--output=collection-report.local")
          if [[ -n "$KOPIS_SLOT" ]]; then args+=("--kopis-slot=$KOPIS_SLOT"); fi
          node scripts/collect-catalog.mjs "${args[@]}"
      - name: Preserve collection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collection-report
          path: collection-report.local
          retention-days: 7

[functions.notification-delivery]
# This server-only endpoint validates NOTIFICATION_CRON_SECRET itself.
# A normal authenticated user's JWT must not grant permission to send push.
verify_jwt = false

[functions.delete-account]
# The handler validates the bearer with Auth getUser before using the Admin API.
verify_jwt = false

[functions.artist-search]
# Search is public; import verifies the Auth user before any registration.
verify_jwt = false

[functions.artist-photo]
# Public metadata only; fixed provider URLs and server-only identity/cache RPCs.
verify_jwt = false

[functions.artist-photo-upload]
# Auth getUser + caller-scoped is_catalog_admin and update RPC validate each write.
verify_jwt = false

[functions.artist-review-runner]
# Dedicated >=32 character runner secret; never a personal/admin login token.
verify_jwt = false

[functions.notification-delivery]
# This server-only endpoint validates NOTIFICATION_CRON_SECRET itself.
# A normal authenticated user's JWT must not grant permission to send push.
verify_jwt = false

[functions.delete-account]
# The handler validates the bearer with Auth getUser before using the Admin API.
verify_jwt = false

[functions.artist-search]
# Search is public; import verifies the Auth user before any registration.
verify_jwt = false
